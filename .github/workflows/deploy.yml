name: CI/CD Pipeline - Deploy to VPS Ubuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: 🔍 Lint & Validate Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

  deploy:
    name: 🚀 Deploy to VPS Ubuntu
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
          TARGET_DIR: ${{ secrets.VPS_TARGET_DIR || '/home/ubuntu/Docker_PHPMyAdmin' }}
          REPO_NAME: ${{ github.repository }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: ENV_CONTENT,TARGET_DIR,REPO_NAME,REPO_TOKEN
          script: |
            set -e

            echo "=========================================="
            echo "🚀 Memulai Deployment Docker di VPS Ubuntu"
            echo "=========================================="

            # 1. Pastikan direktori target sudah ada
            TARGET_EXPANDED=$(eval echo "$TARGET_DIR")
            mkdir -p "$TARGET_EXPANDED"
            cd "$TARGET_EXPANDED"

            # 2. Cek ketersediaan command Docker Compose (v2 atau v1)
            if docker compose version &> /dev/null; then
              DOCKER_COMPOSE="docker compose"
            elif command -v docker-compose &> /dev/null; then
              DOCKER_COMPOSE="docker-compose"
            else
              echo "❌ Error: Docker Compose belum terinstall di VPS!"
              echo "Silakan install Docker Compose terlebih dahulu di VPS Anda."
              exit 1
            fi

            # 3. Cek dependensi git di VPS
            if ! command -v git &> /dev/null; then
              echo "Git belum terpasang. Menginstall git..."
              sudo apt-get update && sudo apt-get install -y git
            fi

            # 4. Sinkronisasi Repository dari GitHub
            if [ ! -d ".git" ]; then
              echo "▶ Cloning repository ke $TARGET_EXPANDED..."
              git clone "https://x-access-token:${REPO_TOKEN}@github.com/${REPO_NAME}.git" .
            else
              echo "▶ Memperbarui repository ke commit terbaru (branch main)..."
              git remote set-url origin "https://x-access-token:${REPO_TOKEN}@github.com/${REPO_NAME}.git"
              git fetch origin main
              git reset --hard origin/main
            fi

            # Kembalikan remote url tanpa token demi keamanan log/config
            git remote set-url origin "https://github.com/${REPO_NAME}.git"

            # 5. Manajemen Konfigurasi (.env)
            echo "▶ Memeriksa file .env..."
            if [ -n "$ENV_CONTENT" ]; then
              echo "Memperbarui file .env dari GitHub Secret (ENV_FILE)..."
              echo "$ENV_CONTENT" > .env
            elif [ ! -f .env ]; then
              if [ -f .env.example ]; then
                echo "File .env belum ada di VPS, membuat salinan dari .env.example..."
                cp .env.example .env
              fi
            else
              echo "File .env yang sudah ada di VPS tetap dipertahankan."
            fi

            # 6. Pull & Restart Docker Containers
            echo "▶ Mengunduh image container terbaru..."
            $DOCKER_COMPOSE pull

            echo "▶ Menjalankan service (MariaDB & phpMyAdmin)..."
            $DOCKER_COMPOSE up -d --remove-orphans

            # 7. Bersihkan image lama yang tidak terpakai
            echo "▶ Membersihkan image docker yang tidak terpakai..."
            docker image prune -f

            echo "=========================================="
            echo "✅ Deployment Sukses! Status Container Saat Ini:"
            echo "=========================================="
            $DOCKER_COMPOSE ps
